<li class="post-list__item">
  <a class="post-list__title" href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a>
  <time class="post-list__date" datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%-d %b %Y" }}</time>
  {%- if include.post.description %}
  <p class="post-list__about">{{ include.post.description }}</p>
  {%- endif %}
</li>
