---
layout: default
---
<article class="post">
  <header class="post__header">
    <h1 class="post__title">{{ page.title }}</h1>
    <p class="post__meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time>
      · {{ content | number_of_words | divided_by: 200 | at_least: 1 }} min read
    </p>
  </header>

  <div class="prose">
    {{ content }}
  </div>

  <footer class="post__footer">
    <a href="{{ '/blog/' | relative_url }}">← All posts</a>
  </footer>
</article>
