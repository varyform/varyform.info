# Behind kamal-proxy, which terminates TLS and forwards plain HTTP on :80.

server {
  listen 80;
  server_name www.varyform.info;
  return 301 https://varyform.info$request_uri;
}

server {
  listen 80 default_server;
  root /usr/share/nginx/html;

  # Relative redirects (/blog → /blog/), or nginx would send http://…:80 URLs.
  absolute_redirect off;

  gzip on;
  gzip_types text/css application/xml application/atom+xml image/svg+xml;

  error_page 404 /404.html;

  # kamal-proxy's health check.
  location = /up {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Stylesheet links carry a per-build ?v= (_includes/head.html).
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
    add_header Cache-Control "no-cache";
  }
}
