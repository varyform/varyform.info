# Listed on the home page, in this order.
- name: rori
  url: https://github.com/varyform/rori
  about: >-
    A niri-style tiling window manager for Rails apps: every page opens as a
    window, driven by ⌘K, a terminal and the keyboard.
  links:
    - label: Live demo
      url: https://rori.varyform.info
    - label: rubygems
      url: https://rubygems.org/gems/rori

- name: haml-lsp
  url: https://github.com/varyform/haml-lsp
  about: >-
    A language server for HAML templates that brings ruby-lsp's hover,
    go-to-definition and completion into your views, plus HAML and Ruby syntax
    diagnostics. Ships with a Zed extension; works in any editor.

- name: environment_gate
  url: https://github.com/varyform/environment-gate
  about: >-
    One shared password in front of a whole Rack or Rails app, for staging,
    demo and preview environments. Shareable unlock links, and messenger link
    previews still work.

- name: Mini Audition
  url: https://mini-audition.com
  about: >-
    A small, fast audio editor for the Mac: zoom down to single samples,
    record, arrange tracks on a multitrack with buses and effects, and
    transcribe on device. Native Swift and Metal, free, no accounts or
    tracking.

- name: Re-Rebirth
  url: https://github.com/varyform/re-rebirth
  about: >-
    A ReBirth RB-338 tribute in the browser: two acid bass lines, two drum
    machines, a mixer and effects, all synthesized live with Web Audio. Opens
    original ReBirth 2.0 songs.
  links:
    - label: Play it
      url: https://rb.varyform.info

- name: NX Play
  url: https://github.com/varyform/nx-native-wrapper
  about: >-
    A Mac app for your own Switch games, built on nxnative: one library to
    build and play them natively on the Mac, install them on an iPhone or iPad,
    and keep their saves in sync. Comes with a full-screen controller mode.
  links:
    - label: Download
      url: https://github.com/varyform/nx-native-wrapper/releases/latest
