- name: Stickman's Fate
  url: https://stickmans-fate.varyform.info
  kind: Browser game
  tone: accent
  image: /assets/images/projects/stickmans-fate.webp
  image_alt: A stickman lands an upside-down capoeira kick on a beach at sunset
