# Listed on the home page, in this order.
- name: rori
  url: https://github.com/varyform/rori
  about: >-
    A niri-style tiling window manager for Rails apps: every page opens as a
    window, driven by ⌘K, a terminal and the keyboard.
  links:
    - label: Live demo
      url: https://rori.varyform.info
    - label: rubygems
      url: https://rubygems.org/gems/rori

- name: haml-lsp
  url: https://github.com/varyform/haml-lsp
  about: >-
    A language server for HAML templates that brings ruby-lsp's hover,
    go-to-definition and completion into your views, plus HAML and Ruby syntax
    diagnostics. Ships with a Zed extension; works in any editor.

- name: environment_gate
  url: https://github.com/varyform/environment-gate
  about: >-
    One shared password in front of a whole Rack or Rails app, for staging,
    demo and preview environments. Shareable unlock links, and messenger link
    previews still work.
