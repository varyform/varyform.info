    .mark { fill: oklch(0.55 0.18 38); }
    @media (prefers-color-scheme: dark) {
      .mark { fill: oklch(0.79 0.16 58); }
    }
  </style>
  <path class="mark" d="M2 16A14 14 0 0 1 16 2H30V16A14 14 0 0 1 16 30H2Z"/>
</svg>
